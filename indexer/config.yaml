# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: tipoff
description: Tipoff sealed scout markets on Monad — programs, sealed tips, hits, payouts and public records.
handlers: src/handlers
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: Tipoff
    abi_file_path: abis/Tipoff.json
    events:
      - event: ProgramCreated
      - event: TipCommitted
      - event: CandidateActed
      - event: TipProven
      - event: HitSettled
      - event: StakeReturned
      - event: RemainderWithdrawn
chains:
  - id: 10143 # Monad testnet
    start_block: 67037405
    contracts:
      - name: Tipoff
        address: 0x50fd4cA4a9B3BB60D772FAd5ecdf4736a5F85707
